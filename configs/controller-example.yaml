# LTP Controller Configuration Example

device:
  id: "auto"  # "auto" generates UUID, or specify explicit UUID
  name: "ltp-controller"
  display_name: "LTP Controller"
  description: "Central routing controller"

web:
  enabled: true
  port: 8080
  host: "127.0.0.1"   # loopback-only by default; set 0.0.0.0 to expose to the LAN.
                      # A non-loopback host requires auth + TLS below, or the
                      # explicit allow_insecure_http acknowledgment.

  # Explicit opt-out: serve plain HTTP / no auth on a network-reachable
  # address. Credentials then cross the network in cleartext — the UI shows
  # a persistent warning banner. Without this, the controller refuses to
  # start in that configuration.
  # allow_insecure_http: true

  # TLS for the web UI/API. mode: auto = HTTPS whenever host is non-loopback
  # (a self-signed certificate is generated on first run); on/off force it.
  # tls:
  #   mode: auto
  #   cert: "~/.config/ltp/web-cert.pem"
  #   key: "~/.config/ltp/web-key.pem"
  #   trust_proxy: false   # true if a reverse proxy terminates TLS in front

  # Authentication + authorization. Roles: admin / operator / viewer.
  # Scope narrows an operator or token: devices (sink ids or group ids),
  # automation (none|run|manage), scenes (run|manage).
  # Generate hashes with: ltp-controller --hash-password / --generate-token
  # auth:
  #   session_ttl_seconds: 43200
  #   users:
  #     - name: alice
  #       role: admin
  #       password_hash: "pbkdf2$sha256$600000$..."
  #     - name: bob                     # one device, no schedules
  #       role: operator
  #       password_hash: "pbkdf2$sha256$600000$..."
  #       scope:
  #         devices: ["hall-strip"]
  #         automation: none
  #   tokens:
  #     - name: home-assistant
  #       role: operator
  #       hash: "sha256:..."
  #       scope:
  #         automation: run

discovery:
  browse_interval: 5.0    # Seconds between mDNS browse refreshes
  timeout: 30.0           # Device timeout (mark offline after this many seconds)

# Pre-configured routes (optional)
# These routes will be created on startup
routes:
  # Example route configuration:
  # - name: "Kitchen Animation"
  #   source: "rainbow-generator"      # Source name or ID
  #   sink: "kitchen-strip"            # Sink name or ID
  #   enabled: true
  #   mode: "proxy"                    # proxy or direct
  #   transform:
  #     scale_mode: "fit"              # fit, fill, stretch, crop
  #     brightness: 1.0                # 0.0 to 1.0
  #     gamma: 1.0                     # Gamma correction
  #     mirror_x: false
  #     mirror_y: false

persistence:
  enabled: true
  file: "~/.config/ltp/routes.yaml"  # Save routes to file (not yet implemented)

logging:
  level: "info"      # debug, info, warning, error
  file: null         # Optional log file path
