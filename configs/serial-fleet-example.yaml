# LTP Serial Sink — fleet mode example
#
# Run with:  ltp-serial-sink --fleet -c serial-fleet.yaml
# (or just `ltp-serial-sink --fleet` for the defaults shown under scan:)
#
# Fleet mode probes matching serial ports with the v2 handshake and runs one
# network sink per LTP device found. Names, descriptions, pixel counts, and
# matrix dimensions come from the devices themselves unless overridden below.
# Each device is only opened once per adoption (opening a port resets AVR
# boards), and device UUIDs are stable across restarts and re-plugs.

fleet:
  scan:
    # Port paths to consider (globs). Prefer /dev/serial/by-id/* when you
    # want stable per-adapter paths; plain /dev/ttyUSB* also works.
    include:
      - "/dev/ttyUSB*"
      - "/dev/ttyACM*"
    exclude: []

    # Only probe adapters with these USB VID:PID pairs, so probe bytes are
    # never written at unrelated serial devices (GPS, modems, ...).
    # Empty list = probe everything matched by include.
    usb_ids:
      - "1a86:7523"   # CH340 (Nano clones)
      - "2341:0043"   # Arduino Uno R3
      # - "10c4:ea60" # CP2102

    baudrate: 115200
    probe_timeout: 4.0    # old-bootloader Nanos need >= 4s
    rescan_interval: 10.0 # seconds; 0 disables hotplug rescanning

  # Optional per-device overrides. First match wins. Match keys AND together:
  #   usb_serial  — USB adapter serial number (most stable; CH340 clones
  #                 often have none — use the self-reported keys below)
  #   device_name  — exact per-INSTANCE name the device reports in INFO
  #   firmware_name — software-load / device TYPE (e.g. "ltp-328p-dual"),
  #                  the same for every board of that build. Use to target
  #                  all devices of a type at once, regardless of instance name.
  #   pixels       — device-reported total pixel count
  #   dimensions   — device-reported geometry: "WxH" for matrices, "N" for strips
  #   port         — glob on the port path (by-path globs pin a physical socket)
  devices:
    - match: { usb_serial: "A5069RR4" }
      name: "Hall Strip"
      description: "Under-cabinet run, 160px"
      # Layer 2 anti-hijack: the bridge enforces a claim + per-message MAC on
      # the network side, so only a controller holding this 16-byte (32-hex)
      # key can command the strip. The AVR itself needs no changes. Put the
      # same key in the controller keystore (~/.config/ltp/keys.yaml) under
      # this device's UUID. Generate one with: openssl rand -hex 16
      # auth_psk: "00112233445566778899aabbccddeeff"
      #
      # Simpler (Phase 5.2): once this fleet is enrolled with the controller
      # (Fleets tab), "Set Key"/"Rotate"/"Unpair" in the controller UI pushes
      # the key here automatically over the encrypted channel — no auth_psk line
      # and no restart needed. A pushed key (stored in
      # ~/.config/ltp/fleet-provisioned.yaml) overrides any auth_psk set here.

    # Two boards with identical firmware name and indistinguishable USB
    # adapters (no serial, same VID:PID): tell them apart by what they
    # report about themselves.
    - match: { device_name: "LTP-328P-Dual", dimensions: "16x5" }
      name: "Workbench Matrix"
    - match: { device_name: "LTP-328P-Dual", pixels: 160 }
      name: "Workbench Strip"

    # Target every board of a firmware type, regardless of instance name —
    # e.g. give all APA102 strips the same auth key:
    # - match: { firmware_name: "ltp-apa102" }
    #   auth_psk: "00112233445566778899aabbccddeeff"

    # Ignore a device without unplugging it:
    # - match: { port: "/dev/ttyUSB3" }
    #   enabled: false

  # Fleet enrollment (Phase 5.1). When enabled, the fleet gets a static X25519
  # identity and advertises a small control endpoint (_ltp-fleet._tcp) that a
  # controller enrolls against — so device keys can be provisioned from the
  # controller UI instead of hand-editing auth_psk above (that push lands in
  # P5.2). The fleet pins the FIRST controller that enrolls (trust-on-first-use).
  #   ltp-serial-sink --enroll-status   # show this fleet's fingerprint + state
  #   ltp-serial-sink --enroll-reset    # forget the controller, allow re-enroll
  enroll:
    enabled: true        # set false to disable the endpoint entirely
    port: 7420           # 0 = ephemeral; the advertised port is the bound one
    # identity_path: ~/.config/ltp/fleet-identity   # default shown
    # trust_path: ~/.config/ltp/fleet-trust.yaml    # default shown
