<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LTP Controller{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="/">LTP Controller</a>
        </div>
        <ul class="navbar-nav">
            <li><a href="/" class="{% if request.path == '/' %}active{% endif %}">Dashboard</a></li>
            <li><a href="/sources" class="{% if request.path == '/sources' %}active{% endif %}">Sources</a></li>
            <li><a href="/sinks" class="{% if request.path == '/sinks' %}active{% endif %}">Sinks</a></li>
            <li><a href="/virtual-sources" class="{% if request.path == '/virtual-sources' %}active{% endif %}">Virtual Sources</a></li>
            <li><a href="/scalar-sources" class="{% if request.path == '/scalar-sources' %}active{% endif %}">Sensors</a></li>
            <li><a href="/routes" class="{% if request.path == '/routes' %}active{% endif %}">Routes</a></li>
            <li><a href="/rules" class="{% if request.path == '/rules' %}active{% endif %}">Rules</a></li>
            <li><a href="/preview" class="{% if request.path == '/preview' %}active{% endif %}">Preview</a></li>
        </ul>
        <div class="navbar-actions">
            <button id="save-config-btn" class="btn btn-save" title="Save routes and rules to config file">Save Config</button>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>LED Topology Protocol Controller v0.1.0</p>
    </footer>

    <!-- Confirm dialog (shared across all pages) -->
    <div id="confirmModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h2 id="confirmTitle">Confirm</h2>
                <button class="close-btn" onclick="ltpConfirmClose(false)">&times;</button>
            </div>
            <div class="confirm-body">
                <p id="confirmMessage"></p>
            </div>
            <div class="confirm-actions">
                <button class="btn" onclick="ltpConfirmClose(false)">Cancel</button>
                <button class="btn btn-danger" id="confirmOkBtn" onclick="ltpConfirmClose(true)">Delete</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
