{% extends "base.html" %}

{% block title %}Paint - {{ sink.name }}{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Paint: {{ sink.name }}</h1>
        <p class="subtitle" id="sinkInfo">Loading...</p>
    </div>
    <a href="/sinks" class="btn">Back to Sinks</a>
</div>

<div class="paint-container">
    <div class="paint-toolbar">
        <div class="tool-group">
            <label>Color:</label>
            <input type="color" id="paintColor" value="#ff0000">
        </div>
        <div class="tool-group">
            <label>Tool:</label>
            <select id="paintTool" onchange="onToolChange()">
                <option value="pixel">Single Pixel</option>
                <option value="line">Line</option>
                <option value="fill">Fill All</option>
                <option value="text">Text</option>
                <option value="image">Image</option>
            </select>
        </div>
        <div class="tool-group" id="textToolGroup" style="display: none;">
            <input type="text" id="paintText" placeholder="Enter text..." style="width: 150px;">
            <div class="font-selector">
                <input type="text" id="fontSearch" placeholder="Search fonts..."
                       style="width: 120px;" oninput="filterFonts()">
                <select id="paintFont" onchange="onFontChange()" style="min-width: 180px;">
                    <!-- Fonts populated dynamically from API -->
                </select>
            </div>
            <input type="number" id="ttfSize" value="16" min="6" max="64" step="1"
                   style="width: 60px; display: none;" title="TTF Font Size (pixels)">
            <button class="btn btn-sm btn-primary" onclick="paintText()">Paint Text</button>
        </div>
        <div class="tool-group" id="imageToolGroup" style="display: none;">
            <input type="file" id="imageFile" accept="image/*">
            <select id="imageFit">
                <option value="contain">Contain</option>
                <option value="cover">Cover</option>
                <option value="stretch">Stretch</option>
            </select>
            <button class="btn btn-sm btn-primary" onclick="paintImage()">Upload</button>
        </div>
        <div class="tool-group">
            <button class="btn btn-sm" onclick="clearCanvas()">Clear</button>
            <button class="btn btn-sm" onclick="syncFromDevice()">Sync</button>
            <button class="btn btn-sm btn-primary" onclick="sendToSink()">Send</button>
        </div>
    </div>

    <div class="paint-canvas-container">
        <canvas id="paintCanvas"></canvas>
    </div>

    <div class="paint-status">
        <span id="cursorPos">-</span>
        <span id="lastAction">Ready</span>
    </div>

    <div class="paint-preview">
        <h3>Device Preview</h3>
        <div class="preview-container">
            <img id="sinkPreview" src="/api/sinks/{{ sink.id }}/preview" alt="Sink Preview">
        </div>
    </div>
</div>

<style>
/* Override container max-width for paint page to use full viewport */
.container {
    max-width: none;
    padding: 0 1rem;
}

.paint-container {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    width: 100%;
}

.paint-toolbar {
    display: flex;
    gap: 1.5rem;
    align-items: center;
    padding: 0.75rem;
    background: var(--secondary-bg, #1f2937);
    border-radius: 8px;
    flex-wrap: wrap;
}

.tool-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.tool-group label {
    font-weight: 500;
    color: var(--text-muted, #9ca3af);
}

.font-selector {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
}

.font-selector input {
    font-size: 0.85rem;
}

#paintFont optgroup {
    font-weight: bold;
}

#paintFont option {
    font-weight: normal;
}

.paint-canvas-container {
    background: #000;
    border-radius: 8px;
    padding: 1rem;
    overflow-x: auto;
    overflow-y: hidden;
}

#paintCanvas {
    border: 1px solid var(--border-color, #374151);
    cursor: crosshair;
    image-rendering: pixelated;
}

.paint-status {
    display: flex;
    justify-content: space-between;
    padding: 0.5rem;
    font-size: 0.875rem;
    color: var(--text-muted, #9ca3af);
}

.paint-preview {
    margin-top: 1rem;
    padding: 1rem;
    background: var(--secondary-bg, #1f2937);
    border-radius: 8px;
}

.paint-preview h3 {
    margin: 0 0 0.75rem 0;
    font-size: 1rem;
    color: var(--text-muted, #9ca3af);
}

.preview-container {
    background: #000;
    border-radius: 4px;
    padding: 0.5rem;
    display: flex;
    justify-content: center;
    overflow: auto;
}

.preview-container img {
    max-width: 100%;
    height: auto;
    image-rendering: pixelated;
}

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1rem;
}
</style>
{% endblock %}

{% block scripts %}
<script>
const sinkId = '{{ sink.id }}';
let width = 60;
let height = 1;
let pixelSize = 10;
let pixels = [];
let canvas, ctx;
let isDrawing = false;
let lastX = -1, lastY = -1;
let availableFonts = [];
let hasTTF = false;

// Initialize
async function init() {
    // Get sink info
    const response = await fetch(`/api/sinks/${sinkId}/paint/info`);
    const info = await response.json();

    width = info.dimensions[0];
    height = info.dimensions.length > 1 ? info.dimensions[1] : 1;
    hasTTF = info.has_ttf || false;
    availableFonts = info.fonts || [];

    // Populate font dropdown
    populateFontDropdown(info.fonts, info.default_font);

    document.getElementById('sinkInfo').textContent =
        `${width}x${height} (${info.pixels} pixels) - ${info.type}`;

    // Calculate pixel size for display
    // Use most of the available viewport width
    const maxWidth = window.innerWidth - 80;
    const maxHeight = window.innerHeight - 300;

    // For 1D strips, prioritize fitting in width; for 2D, balance both
    if (height === 1) {
        // 1D strip: fit to width, allow reasonable height
        pixelSize = Math.max(4, Math.min(Math.floor(maxWidth / width), 30));
    } else {
        // 2D matrix: balance width and height
        pixelSize = Math.max(4, Math.min(
            Math.floor(maxWidth / width),
            Math.floor(maxHeight / height),
            20
        ));
    }

    // Initialize pixel buffer
    pixels = new Array(width * height).fill(null).map(() => [0, 0, 0]);

    // Setup canvas
    canvas = document.getElementById('paintCanvas');
    canvas.width = width * pixelSize;
    canvas.height = height * pixelSize;
    ctx = canvas.getContext('2d');

    // Event listeners
    canvas.addEventListener('mousedown', onMouseDown);
    canvas.addEventListener('mousemove', onMouseMove);
    canvas.addEventListener('mouseup', onMouseUp);
    canvas.addEventListener('mouseleave', onMouseUp);

    // Load current state from device
    await fetchBuffer();
    drawCanvas();
}

function getPixelCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - rect.left) / pixelSize);
    const y = Math.floor((e.clientY - rect.top) / pixelSize);
    return { x: Math.max(0, Math.min(width - 1, x)), y: Math.max(0, Math.min(height - 1, y)) };
}

function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? [
        parseInt(result[1], 16),
        parseInt(result[2], 16),
        parseInt(result[3], 16)
    ] : [255, 255, 255];
}

function setPixel(x, y, color) {
    if (x >= 0 && x < width && y >= 0 && y < height) {
        const idx = y * width + x;
        pixels[idx] = color;
    }
}

function drawLine(x0, y0, x1, y1, color) {
    // Bresenham's line algorithm
    const dx = Math.abs(x1 - x0);
    const dy = Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1;
    const sy = y0 < y1 ? 1 : -1;
    let err = dx - dy;

    while (true) {
        setPixel(x0, y0, color);
        if (x0 === x1 && y0 === y1) break;
        const e2 = 2 * err;
        if (e2 > -dy) { err -= dy; x0 += sx; }
        if (e2 < dx) { err += dx; y0 += sy; }
    }
}

function onMouseDown(e) {
    isDrawing = true;
    const { x, y } = getPixelCoords(e);
    const color = hexToRgb(document.getElementById('paintColor').value);
    const tool = document.getElementById('paintTool').value;

    if (tool === 'fill') {
        pixels = pixels.map(() => [...color]);
        drawCanvas();
        sendToSink();
        return;
    }

    setPixel(x, y, color);
    lastX = x;
    lastY = y;
    drawCanvas();

    document.getElementById('lastAction').textContent = `Set (${x}, ${y})`;
}

function onMouseMove(e) {
    const { x, y } = getPixelCoords(e);
    document.getElementById('cursorPos').textContent = `(${x}, ${y})`;

    if (!isDrawing) return;

    const color = hexToRgb(document.getElementById('paintColor').value);
    const tool = document.getElementById('paintTool').value;

    if (tool === 'line' && lastX >= 0) {
        drawLine(lastX, lastY, x, y, color);
    } else {
        setPixel(x, y, color);
    }

    lastX = x;
    lastY = y;
    drawCanvas();
}

function onMouseUp(e) {
    if (isDrawing) {
        isDrawing = false;
        sendToSink();
    }
    lastX = -1;
    lastY = -1;
}

function drawCanvas() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const idx = y * width + x;
            const [r, g, b] = pixels[idx];
            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
            ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize - 1, pixelSize - 1);
        }
    }

    // Draw grid for small canvases
    if (pixelSize >= 8) {
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1;
        for (let x = 0; x <= width; x++) {
            ctx.beginPath();
            ctx.moveTo(x * pixelSize, 0);
            ctx.lineTo(x * pixelSize, canvas.height);
            ctx.stroke();
        }
        for (let y = 0; y <= height; y++) {
            ctx.beginPath();
            ctx.moveTo(0, y * pixelSize);
            ctx.lineTo(canvas.width, y * pixelSize);
            ctx.stroke();
        }
    }
}

function clearCanvas() {
    pixels = pixels.map(() => [0, 0, 0]);
    drawCanvas();
    sendToSink();
    document.getElementById('lastAction').textContent = 'Cleared';
    setTimeout(refreshPreview, 100);
}

async function sendToSink() {
    // Convert to sparse pixel map for efficiency
    const pixelMap = {};
    for (let i = 0; i < pixels.length; i++) {
        pixelMap[i] = pixels[i];
    }

    try {
        const response = await fetch(`/api/sinks/${sinkId}/paint`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pixels: pixelMap })
        });
        const data = await response.json();
        if (data.status !== 'ok') {
            console.error('Paint error:', data);
        } else {
            // Refresh preview after successful paint
            setTimeout(refreshPreview, 100);
        }
    } catch (err) {
        console.error('Failed to send:', err);
    }
}

function onToolChange() {
    const tool = document.getElementById('paintTool').value;
    document.getElementById('textToolGroup').style.display = tool === 'text' ? 'flex' : 'none';
    document.getElementById('imageToolGroup').style.display = tool === 'image' ? 'flex' : 'none';
}

function populateFontDropdown(fonts, defaultFont, filter = '') {
    const select = document.getElementById('paintFont');
    const currentValue = select.value;
    select.innerHTML = '';

    // Filter fonts if search term provided
    let filteredFonts = fonts;
    if (filter) {
        const lowerFilter = filter.toLowerCase();
        filteredFonts = fonts.filter(f =>
            f.name.toLowerCase().includes(lowerFilter) ||
            f.label.toLowerCase().includes(lowerFilter)
        );
    }

    // Group fonts by category
    const bitmapFonts = filteredFonts.filter(f => f.type === 'bitmap');
    const recommendedTTF = filteredFonts.filter(f => f.category === 'ttf_recommended');
    const otherTTF = filteredFonts.filter(f => f.category === 'ttf_other');

    // Add bitmap fonts first
    if (bitmapFonts.length > 0) {
        const bitmapGroup = document.createElement('optgroup');
        bitmapGroup.label = '📦 Bitmap Fonts (built-in)';
        bitmapFonts.forEach(font => {
            const option = document.createElement('option');
            option.value = font.name;
            option.textContent = font.label;
            option.dataset.type = 'bitmap';
            if (font.name === defaultFont || font.name === currentValue) option.selected = true;
            bitmapGroup.appendChild(option);
        });
        select.appendChild(bitmapGroup);
    }

    // Add recommended TTF fonts
    if (recommendedTTF.length > 0 && hasTTF) {
        const recGroup = document.createElement('optgroup');
        recGroup.label = '⭐ Recommended TTF';
        recommendedTTF.forEach(font => {
            const option = document.createElement('option');
            option.value = font.name;
            option.textContent = font.label;
            option.dataset.type = 'ttf';
            if (font.name === currentValue) option.selected = true;
            recGroup.appendChild(option);
        });
        select.appendChild(recGroup);
    }

    // Add other TTF fonts
    if (otherTTF.length > 0 && hasTTF) {
        const otherGroup = document.createElement('optgroup');
        otherGroup.label = '🔤 Other System Fonts';
        otherTTF.forEach(font => {
            const option = document.createElement('option');
            option.value = font.name;
            option.textContent = font.label;
            option.dataset.type = 'ttf';
            if (font.name === currentValue) option.selected = true;
            otherGroup.appendChild(option);
        });
        select.appendChild(otherGroup);
    }

    // Show message if no fonts match
    if (filteredFonts.length === 0) {
        const option = document.createElement('option');
        option.textContent = 'No fonts match search';
        option.disabled = true;
        select.appendChild(option);
    }

    // Update TTF size visibility based on current selection
    onFontChange();
}

function filterFonts() {
    const searchTerm = document.getElementById('fontSearch').value;
    populateFontDropdown(availableFonts, null, searchTerm);
}

function onFontChange() {
    const select = document.getElementById('paintFont');
    const ttfSizeInput = document.getElementById('ttfSize');
    const selectedOption = select.options[select.selectedIndex];

    if (selectedOption && selectedOption.dataset.type === 'ttf') {
        ttfSizeInput.style.display = 'inline-block';
        // Default to height of the display for a good fit
        if (ttfSizeInput.value === '16') {
            ttfSizeInput.value = Math.min(height, 64);
        }
    } else {
        ttfSizeInput.style.display = 'none';
    }
}

async function paintText() {
    const text = document.getElementById('paintText').value;
    if (!text) {
        showToast('Please enter text to paint', 'warning');
        return;
    }

    const color = document.getElementById('paintColor').value;
    const font = document.getElementById('paintFont').value;
    const ttfSize = parseInt(document.getElementById('ttfSize').value) || 16;
    const selectedOption = document.getElementById('paintFont').options[
        document.getElementById('paintFont').selectedIndex
    ];
    const isTTF = selectedOption && selectedOption.dataset.type === 'ttf';

    try {
        const body = {
            text: text,
            color: color,
            font: font,
            clear: false  // Overlay on existing content
        };

        // Include TTF size if it's a TTF font
        if (isTTF) {
            body.ttf_size = ttfSize;
        }

        const response = await fetch(`/api/sinks/${sinkId}/paint/text`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await response.json();
        if (data.status === 'ok') {
            document.getElementById('lastAction').textContent = `Painted: "${text}"`;
            // Refresh canvas from sink
            await refreshFromSink();
        } else {
            showToast('Error painting text: ' + (data.error || 'Unknown error'), 'error');
        }
    } catch (err) {
        console.error('Failed to paint text:', err);
        showToast('Failed to paint text', 'error');
    }
}

async function paintImage() {
    const fileInput = document.getElementById('imageFile');
    if (!fileInput.files || !fileInput.files[0]) {
        showToast('Please select an image file', 'warning');
        return;
    }

    const fit = document.getElementById('imageFit').value;
    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    formData.append('fit', fit);

    try {
        document.getElementById('lastAction').textContent = 'Uploading image...';
        const response = await fetch(`/api/sinks/${sinkId}/paint/image`, {
            method: 'POST',
            body: formData
        });
        const data = await response.json();
        if (data.status === 'ok') {
            document.getElementById('lastAction').textContent =
                `Image: ${data.original_size[0]}x${data.original_size[1]} -> ${data.dimensions[0]}x${data.dimensions[1]} (${data.fit})`;
            await refreshFromSink();
        } else {
            showToast('Error uploading image: ' + (data.error || data.message || 'Unknown error'), 'error');
            document.getElementById('lastAction').textContent = 'Image upload failed';
        }
    } catch (err) {
        console.error('Failed to upload image:', err);
        showToast('Failed to upload image', 'error');
        document.getElementById('lastAction').textContent = 'Image upload failed';
    }
}

function refreshPreview() {
    // Refresh the sink preview image
    const preview = document.getElementById('sinkPreview');
    if (preview) {
        const src = preview.src.split('?')[0];
        preview.src = src + '?t=' + Date.now();
    }
}

async function fetchBuffer() {
    // Fetch the current paint buffer from the server and sync local state
    try {
        const response = await fetch(`/api/sinks/${sinkId}/paint/buffer`);
        const data = await response.json();
        if (data.pixels) {
            // Update local pixels array from server
            for (let i = 0; i < data.pixels.length && i < pixels.length; i++) {
                pixels[i] = data.pixels[i];
            }
            drawCanvas();
        }
    } catch (err) {
        console.error('Failed to fetch buffer:', err);
    }
}

async function refreshFromSink() {
    // Sync local state from server and refresh preview
    await fetchBuffer();
    refreshPreview();
    document.getElementById('lastAction').textContent += ' (synced from device)';
}

async function syncFromDevice() {
    // Manually sync local canvas from device state
    document.getElementById('lastAction').textContent = 'Syncing...';
    await fetchBuffer();
    refreshPreview();
    document.getElementById('lastAction').textContent = 'Synced from device';
}

// Initialize on load
init();
</script>
{% endblock %}
